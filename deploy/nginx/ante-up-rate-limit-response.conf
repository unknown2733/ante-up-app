# Include only inside Ante Up's HTTPS server block. Existing limit_req_zone,
# limit_req burst/nodelay and limit_req_status 429 settings remain authoritative.
# Upstream errors are not intercepted (keep proxy_intercept_errors off).
error_page 429 = @ante_up_rate_limited;
location @ante_up_rate_limited {
  default_type application/json;
  add_header Retry-After 5 always;
  add_header Cache-Control no-store always;
  return 429 '{"code":"HTTP_RATE_LIMITED","message":"Too many requests. Please wait 5 seconds and retry.","retryable":true,"requestId":null}';
}
